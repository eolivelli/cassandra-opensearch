# OpenSearch's logging configuration.
#
# Two things about this file are not stock, and both are load-bearing.
#
# 1. There is no %node_name anywhere in it. OpenSearch's stock log4j2.properties uses that
#    converter throughout; it is implemented by NodeNamePatternConverter, which throws
#    IllegalStateException("...node name wasn't set") on every single log event until
#    LogConfigurator.setNodeName has been called. This project never calls LogConfigurator: it
#    also sets java.util.logging.manager, hijacking JUL for the whole JVM, and calls
#    System.setOut/System.setErr, which would swallow Cassandra's console output into
#    OpenSearch's logger. See docs/spikes/opensearch-embedding.md.
#
# 2. The log directory comes from cassandra-opensearch.logs rather than from
#    opensearch.logs.base_path. That property is another thing LogConfigurator would have set,
#    so it is unset here and ${sys:opensearch.logs.base_path} would expand to the literal string.
#    bin/cassandra-opensearch sets cassandra-opensearch.logs; if you point `directories.logs` in
#    conf/cassandra-opensearch.yaml somewhere other than <home>/logs, set CASSANDRA_OPENSEARCH_LOGS
#    to the same place or these files stay behind in <home>/logs.
#
# This file is found because conf/ is on the opensearch child ClassLoader's classpath, which
# lib/opensearch/000-conf-classpath.jar arranges through its manifest. Setting
# -Dlog4j.configurationFile would work too but is a JVM global, and each isolated service is
# supposed to configure its own logging.

status = error

property.logs = ${sys:cassandra-opensearch.logs:-logs}
property.pattern = [%d{ISO8601}][%-5p][%-25c{1.}] %marker%m%n

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

appender.rolling.type = RollingFile
appender.rolling.name = rolling
appender.rolling.fileName = ${logs}/opensearch.log
appender.rolling.filePattern = ${logs}/opensearch-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = ${pattern}
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 128MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.fileIndex = nomax
appender.rolling.strategy.action.type = Delete
appender.rolling.strategy.action.basepath = ${logs}
appender.rolling.strategy.action.condition.type = IfFileName
appender.rolling.strategy.action.condition.glob = opensearch-*.log.gz
appender.rolling.strategy.action.condition.nested_condition.type = IfAccumulatedFileSize
appender.rolling.strategy.action.condition.nested_condition.exceeds = 2GB

rootLogger.level = info
rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.rolling.ref = rolling

# Deprecation warnings are noise in a log an operator reads for health; they still reach the
# file, just not the console.
logger.deprecation.name = org.opensearch.deprecation
logger.deprecation.level = warn
logger.deprecation.additivity = false
logger.deprecation.appenderRef.rolling.ref = rolling
